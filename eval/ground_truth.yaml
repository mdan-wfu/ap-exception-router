  aggregate_by_canonical: {WidgetA: 3, WidgetB: 2}
  payment_terms: "Net 30"
  must_fire: [DP-002]         # batch-scoped duplicate-with-differing-content
  may_fire: [DP-003]
  expected_outcome: [ESCALATE]

