# Ground truth for the 16-invoice corpus.
#
# Sources, in priority order:
#   1. eval/source_literals.py (generator forensics — INV-1011/1012/1013)
#   2. raw source files read directly (every other invoice)
#   3. CLAUDE.md §6 for the domain assertions (aggregate quantities, etc.)
#
# Never derived from the system's own output — that would be circular.
#
# `must_fire` — codes the deterministic validators MUST raise on this invoice.
#               An eval failure here is a validator bug.
# `may_fire`  — codes that are heuristic / boundary-tolerance (FR-*, some PR-*).
#               Reported by the eval but never scored against.
# `expected_outcome` — set of defensible Adjudicator outcomes given the
#                      Phase 7 reconciliation. Single-valued where the answer
#                      is clear; multi-valued where the model could
#                      legitimately land on either side (INV-1005 / 1008 /
#                      1009 / 1013 / 1016).

INV-1001:
  files: [invoice_1001.txt]
  vendor_name: "Widgets Inc."
  currency: USD
  stated_total_usd: 5000.00
  line_item_count: 2
  aggregate_by_canonical: {WidgetA: 10, WidgetB: 5}
  payment_terms: "Net 15"
  must_fire: []
  may_fire: []
  expected_outcome: [APPROVE]

INV-1002:
  files: [invoice_1002.txt]
  vendor_name: "Gadgets Co."
  currency: USD
  stated_total_usd: 15000.00
  line_item_count: 1
  aggregate_by_canonical: {GadgetX: 20}
  payment_terms: "Net 30"
  must_fire: [PO-001, IN-003, TM-003]
  may_fire: [TM-001]      # `due_date == invoice_date` may or may not trip depending on parse
  expected_outcome: [ESCALATE, REJECT]

INV-1003:
  files: [invoice_1003.txt]
  vendor_name: "Fraudster LLC"
  currency: USD
  stated_total_usd: 100000.00
  line_item_count: 1
  aggregate_by_canonical: {FakeItem: 100}
  payment_terms: "Immediate"
  must_fire: [VN-001, IN-002, PO-001, TM-003]
  may_fire: [FR-001, FR-002, PR-004]
  expected_outcome: [REJECT]

INV-1004:
