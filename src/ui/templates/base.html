<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AP Exception Router{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0f172a;
    --accent: #1d4ed8;
    --amber: #d97706;
    --amber-bg: #fef3c7;
    --green: #15803d;
    --green-bg: #dcfce7;
    --red: #b91c1c;
    --red-bg: #fee2e2;
    --line: #e2e8f0;
    --muted: #64748b;
    --paper: #ffffff;
    --bg: #f8fafc;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  .display { font-family: "Playfair Display", Georgia, serif; letter-spacing: -0.01em; }
  .prose { font-family: Georgia, "Times New Roman", serif; line-height: 1.7; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
  .chip-approve  { background: var(--green-bg); color: var(--green); }
  .chip-reject   { background: var(--red-bg);   color: var(--red); }
  .chip-escalate { background: var(--amber-bg); color: var(--amber); }
  .chip-info     { background: #e0e7ff;         color: #3730a3; }
  .chip-critical { background: var(--red-bg);   color: var(--red); }
  .chip-high     { background: var(--amber-bg); color: var(--amber); }
  .chip-medium   { background: #fef3c7;         color: #92400e; }
  .chip-low      { background: #f1f5f9;         color: var(--muted); }
  .chip-provided { background: #e0e7ff;         color: #3730a3; }
  .chip-adversarial { background: #fce7f3;      color: #9d174d; }
  .link-accent { color: var(--accent); }
  .link-accent:hover { text-decoration: underline; }
  .divider { border-top: 1px solid var(--line); }
  code, .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .code-panel { background: #0f172a; color: #e2e8f0; }
</style>
</head>
<body>
<header class="border-b bg-white">
  <div class="max-w-7xl mx-auto px-8 py-6 flex items-baseline justify-between">
    <div>
      <a href="/" class="display text-2xl">AP Exception Router</a>
      <p class="text-sm text-slate-500 mt-0.5">Acme Corp — post-run audit view</p>
    </div>
    <nav class="text-sm space-x-6">
      <a class="link-accent" href="/">Queue</a>
      <a class="link-accent" href="/queue">Human review</a>
    </nav>
  </div>
</header>

<main class="max-w-7xl mx-auto px-8 py-10">
{% block content %}{% endblock %}
</main>

<footer class="max-w-7xl mx-auto px-8 py-10 text-xs text-slate-400 border-t mt-16">
  Reads runs/audit.sqlite. Zero API calls at page load. LLM_MODE=replay throughout.
</footer>
</body>
</html>
